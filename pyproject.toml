[project]
name = "ariadne"
version = "0.1.0"
description = "AI-first knowledge engine — GraphRAG + MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
]

[project.scripts]
ariadne = "ariadne.cli:main"
ariadne-mcp = "ariadne.mcp.server:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.5",
]
docs = [
    "openpyxl>=3.1",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1",
]
ocr = [
    "rapidocr-onnxruntime>=1.3",
]
web = [
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: precisa do Postgres do docker-compose rodando",
]

# PyTorch em CPU: o reranker reordena algumas dezenas de candidatos, o que a
# CPU faz em ~1s. Evita de vez o risco da wheel CUDA para Blackwell (sm_120),
# que instala "com sucesso" e so falha na primeira inferencia -- e deixa a GPU
# livre para o LLM de extracao, que e quem precisa dela.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
