services:
  postgres:
    build:
      context: ./docker/postgres
    image: ariadne/postgres:16-pgvector-age
    container_name: ariadne-postgres
    environment:
      POSTGRES_USER: ${ARIADNE_PG_USER:-ariadne}
      POSTGRES_PASSWORD: ${ARIADNE_PG_PASSWORD:-ariadne}
      POSTGRES_DB: ${ARIADNE_PG_DATABASE:-ariadne}
    # 15432 no host: as portas 5432 e 5433 caem dentro dos intervalos que o
    # Hyper-V reserva no Windows (ex.: 5358-5457), e o bind falha com
    # "forbidden by its access permissions". Ver: netsh interface ipv4
    # show excludedportrange protocol=tcp
    ports:
      - "${ARIADNE_PG_PORT:-15432}:5432"
    # Precarrega o AGE: sem isso, cada conexao precisaria de LOAD 'age'.
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARIADNE_PG_USER:-ariadne} -d ${ARIADNE_PG_DATABASE:-ariadne}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
